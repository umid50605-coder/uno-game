<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>UNO</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/static/css/base.css?v=12" />
<link rel="stylesheet" href="/static/css/game.css?v=12" />
</head>
<body>

<!-- Lobby ekrani -->
<div id="lobby-screen">
  <div id="leaderboard" class="leaderboard"></div>

  <button id="create-room-btn">+ Yangi xona</button>
  <button id="tournament-btn" class="lobby-btn">🏆 Tournament</button>
  <div style="display:flex; gap:8px; margin: 8px 0;">
    <input id="search-input" type="text" placeholder="Xona kodini kiriting" style="flex:1; padding:8px; border-radius:6px; border:none;" />
    <button id="search-btn">Qidirish</button>
  </div>
  <button id="random-btn">🎲 Tasodifiy xona</button>
  <div id="room-list"></div>
</div>

<!-- Tournament kirish/lobby -->
<div id="tournament-lobby-screen" class="screen hidden">
  <div id="tournament-entry-view">
    <h2>🏆 Tournament</h2>
    <button id="tournament-create-btn" class="lobby-btn">Turnir yaratish</button>
    <div class="tournament-divider">yoki</div>
    <input id="tournament-join-input" type="text" placeholder="Taklif havolasi yoki ID_TOKEN" />
    <button id="tournament-join-btn" class="lobby-btn">Qo'shilish</button>
    <button id="tournament-back-btn" class="lobby-btn secondary">← Orqaga</button>
  </div>

  <div id="tournament-lobby-view" class="hidden">
    <p id="tournament-status" class="tournament-status"></p>
    <p id="tournament-countdown" class="tournament-countdown"></p>

    <div id="tournament-invite-link" class="hidden">
      <button id="tournament-copy-link-btn" class="lobby-btn">📋 Havolani nusxalash</button>
    </div>

    <div id="tournament-player-list" class="tournament-player-list"></div>

    <div class="tournament-lobby-actions">
      <button id="tournament-ready-btn" class="lobby-btn">Tayyor</button>
      <button id="tournament-leave-btn" class="lobby-btn secondary">Chiqish</button>
    </div>
  </div>

  <div id="tournament-lobby-error" class="lobby-error hidden"></div>
</div>

<!-- Tournament bracket / live-view -->
<div id="tournament-screen" class="screen hidden">
  <h2 id="tournament-view-status" class="tournament-status"></h2>
  <button id="tournament-cancel-btn" class="lobby-btn danger">Turnirni bekor qilish</button>

  <div id="tournament-rounds" class="tournament-rounds"></div>

  <div id="tournament-final-banner" class="tournament-final-banner hidden"></div>

  <div id="tournament-view-error" class="lobby-error hidden"></div>
</div>

<!-- Tanlov ekrani (public / security) -->
<div id="room-choice-screen" class="hidden">
  <button class="back-btn" data-back="lobby">← Orqaga</button>
  <h2>Xona turini tanlang</h2>
  <button id="choice-public-btn">🌐 Public (ochiq)</button>
  <button id="choice-security-btn">🔒 Security (maxfiy)</button>
</div>

<!-- Kod yaratish ekrani (faqat security uchun) -->
<div id="create-code-screen" class="hidden">
  <button class="back-btn" data-back="room-choice">← Orqaga</button>
  <h2>Maxfiy kod yarating</h2>
  <input id="code-input" type="text" placeholder="Kodni kiriting" maxlength="16" style="width:100%; padding:8px; border-radius:6px; border:none; margin: 8px 0;" />
  <button id="code-create-btn">Yaratish</button>
</div>

<!-- Xona (kutish) ekrani -->
<div id="room-screen" class="hidden">
  <button id="room-back-btn" class="back-btn">← Orqaga</button>
  <h2 id="room-code"></h2>
  <div id="room-join-code" style="color:#f1c40f; margin-bottom:8px;"></div>
  <div id="room-players" class="room-players"></div>
  <div id="room-status" class="room-status"></div>
  <button id="room-ready-btn">Tayyorman</button>
  <button id="room-wait-btn">Kutish (+60s)</button>
</div>

<!-- O'yin ekrani -->
<div id="game-screen" class="hidden">
  <div id="connection-banner" class="connection-banner hidden"></div>
  <div id="opponent-disconnect-banner" class="hidden"></div>
  <div id="opponents" class="opponents"></div>

  <div class="table">
    <div id="top-card" class="table-card"></div>
    <div class="draw-pile" id="draw-btn">
      🂠 <span id="draw-pile-count"></span>
    </div>
  </div>

  <div id="stack-indicator" class="stack-indicator hidden"></div>
  <div id="turn-indicator" class="turn-indicator"></div>

  <button id="uno-btn" class="uno-btn hidden">UNO!</button>

  <div id="my-hand" class="hand"></div>

  <div id="color-picker" class="color-picker hidden">
    <button style="background:#e74c3c" data-color="red"></button>
    <button style="background:#f1c40f" data-color="yellow"></button>
    <button style="background:#2ecc71" data-color="green"></button>
    <button style="background:#3498db" data-color="blue"></button>
  </div>

  <div id="game-over" class="game-over hidden"></div>
  <div id="game-error" class="game-error hidden"></div>
  <div id="game-toast" class="game-toast hidden"></div>
</div>

<script type="module" src="/static/js/main.js?v=12"></script>
</body>
</html>
